name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Позволяет запустить деплой вручную из вкладки Actions.
  workflow_dispatch:

# Нужны для публикации через официальный экшен Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: в очереди держим только последний коммит.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      # Сайт живёт по адресу https://<owner>.github.io/<repo>/
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # enablement: включает Pages в репозитории, если это ещё не сделано
      # руками в Settings → Pages. Без этого шаг падает с 404.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
